    .line-curve { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: drawLine 2s ease-out forwards; }
    .fade-area { opacity: 0; animation: fadeIn 1.5s ease-out forwards 0.5s; }
    @keyframes drawLine { to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>

  <!-- Header -->
  <g transform="translate(30, 36)">
